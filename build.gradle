plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    implementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // MixinExtras for advanced injectors
    implementation "io.github.llamalad7:mixinextras-fabric:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.4.1"

    // Optional GUI Dependencies (compile-only required, runtime-optional for players)
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    runtimeOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"

    // Automated Unit Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

// Loom configuration
loom {
    // No longer using legacy mixin block as per Loom 1.14+ requirements
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive Jar of all versions and Modrinth profile'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    // 1. Central Outer Archive (MC 26.3)
                    def archiveDir = file("../../Archive Jar of all versions/MC 26.3")
                    if (!archiveDir.exists()) {
                        archiveDir.mkdirs()
                    }
                    copy {
                        from jarFile
                        into archiveDir
                    }
                    println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"

                    // 2. Modrinth Profile Sync (if directory exists)
                    def modrinthProfileMods = file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3ish/mods")
                    if (modrinthProfileMods.exists()) {
                        modrinthProfileMods.listFiles().each { f ->
                            if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                f.delete()
                                println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                            }
                        }
                        copy {
                            from jarFile
                            into modrinthProfileMods
                        }
                        println "[MODRINTH-SYNC] Deployed ${jarFile.name} to Modrinth profile mods folder."
                    }
                }
            }
        }

        tasks.named('build').configure {
            finalizedBy archiveTask
        }
    }
}

